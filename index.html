<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="__BASE_PATH__favicon-v3.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="__BASE_PATH__icon-192-v3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="__BASE_PATH__apple-touch-icon-v3.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="__THEME_COLOR__" />
    <meta name="application-name" content="__APP_NAME__" />
    <meta name="apple-mobile-web-app-title" content="__APP_NAME__" />
    <meta name="description" content="__APP_DESCRIPTION__" />
    <link rel="manifest" href="__BASE_PATH__manifest.json" />
    <title>__APP_NAME__</title>
    <script>
      (function() {
        var theme = localStorage.getItem('football-theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.add('light');
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('__BASE_PATH__sw.js', {
          scope: '__BASE_PATH__',
        })
      }
    </script>
  </body>
</html>
